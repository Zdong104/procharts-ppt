<div id="app">
  <header class="pc-head">
    <button type="button" class="pc-type-btn" id="type-btn" aria-haspopup="dialog" disabled>
      <span class="pc-type-thumb" id="type-thumb" hidden></span>
      <span class="pc-type-text"><span class="title" id="title">Add to the slide</span><span class="subtitle" id="subtitle">Charts and elements, with sample data</span></span>
      <span class="pc-type-chev" id="type-chev" hidden></span>
    </button>
    <div class="pc-head-actions">
      <button type="button" class="pc-icon-btn" id="preview-toggle" hidden></button>
      <button type="button" class="pc-btn pc-btn-ghost" id="btn-new" title="Insert another chart or element" data-i18n-attr="title" hidden></button>
      <button type="button" class="pc-icon-btn" id="btn-license"></button>

  <div class="license-note" id="license-note" role="status" hidden></div>

    <div class="gallery" id="gallery"></div>
    <p class="gallery-none" id="gallery-none" data-i18n hidden>Nothing matches. Try another word.</p>
  </section>

  <section class="view" id="view-edit" hidden>
    <div class="preview-wrap" id="preview-wrap"><div class="preview-card"><div id="preview" class="preview"></div></div></div>
    <div class="warnings" id="warnings" role="status"></div>
    <div class="quickbar" id="quickbar" role="toolbar" aria-label="Quick settings" data-i18n-attr="aria-label"></div>
    <nav class="tabs" role="tablist">

      <button type="button" id="tab-btn-options" class="tab-btn" role="tab" data-i18n>Options</button>

</div>
